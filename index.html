<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="meta.title">K-Bap — read any Korean menu</title>
<meta name="description" data-i18n-content="meta.description" content="Point your camera at a Korean menu. K-Bap translates every dish and marks the ones containing ingredients you listed as off-limits.">
<meta name="theme-color" content="#FBF6EC">
<link rel="canonical" href="https://team-skyjs.github.io/kbap-landing/">
<link rel="icon" href="assets/brand/icon.webp" type="image/webp">
<link rel="apple-touch-icon" href="assets/brand/icon.webp">

<meta property="og:type" content="website">
<meta property="og:url" content="https://team-skyjs.github.io/kbap-landing/">
<meta property="og:title" data-i18n-content="meta.title" content="K-Bap — read any Korean menu">
<meta property="og:description" data-i18n-content="meta.description" content="Point your camera at a Korean menu. K-Bap translates every dish and marks the ones containing ingredients you listed as off-limits.">
<meta property="og:image" content="https://team-skyjs.github.io/kbap-landing/assets/brand/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Which store this device has, decided before first paint so the badge row is
     right in the first frame and nothing moves afterwards. No JS: both badges
     stay, sized to still sit on one row. -->
<script>(function(u,d){if(/iPhone|iPad|iPod/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))d.className='ios';else if(/Android/.test(u))d.className='android';})(navigator.userAgent,document.documentElement);</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- Pretendard is the app's and the ad creative's typeface. Loaded off the
     critical path so a slow CDN can't hold up first paint on paid traffic. -->
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"></noscript>

<!-- Meta Pixel: no pixel exists on the ad account (checked 2026-09-21). When one is
     created, the base code goes here. Nothing is loaded until then. -->
</head>
<body>

<main class="hero">
  <div class="glow" aria-hidden="true"></div>

  <div class="copy">
    <h1>
      <span data-i18n="hero.headline1">You can't read</span>
      <span data-i18n="hero.headline2">the menu.</span>
      <span class="dim" data-i18n="hero.headline3">K-Bap can.</span>
    </h1>

    <p class="lede" data-i18n="hero.sub">Snap a Korean menu. The dishes you should skip come back marked.</p>

    <div class="badges">
      <a class="badge badge-apple" data-store="ios" href="https://apps.apple.com/app/id6788635067">
        <img src="assets/badges/app-store-black.svg" data-i18n-alt="store.appleAlt" alt="Download on the App Store" width="156" height="52">
      </a>
      <a class="badge badge-play" data-store="android" href="https://play.google.com/store/apps/details?id=com.rocher.kbap">
        <img src="assets/badges/google-play.png" data-i18n-alt="store.playAlt" alt="Get it on Google Play" width="199" height="77">
      </a>
    </div>

    <p class="note" data-i18n="hero.note">Free · 10 languages</p>
  </div>

  <!-- The app itself, rising into frame and cut off by the fold. No device
       frame: just the screen, so there is nothing for Apple's device-image
       rules to object to. -->
  <div class="stage">
    <img class="screen" src="assets/shots/home.webp" data-i18n-alt="hero.shotAlt"
         alt="The K-Bap home screen, with a scan button and dishes rated safe for the user"
         width="600" height="1299" fetchpriority="high" decoding="async">
  </div>
</main>

<footer>
  <nav aria-label="Legal">
    <a href="https://team-skyjs.github.io/kbap-legal/privacy-policy.html" data-i18n="footer.privacy">Privacy</a>
    <a href="https://team-skyjs.github.io/kbap-legal/terms-of-service.html" data-i18n="footer.terms">Terms</a>
    <a href="https://team-skyjs.github.io/kbap-legal/safety.html" data-i18n="footer.safety">Safety</a>
  </nav>
  <p class="disclaimer" data-i18n="footer.disclaimer">Ingredient information is a guide, not medical advice.</p>
  <p class="copy-line" data-i18n="footer.copyright">© 2026 Team SkyJS</p>
</footer>

<script src="app.js"></script>
</body>
</html>
